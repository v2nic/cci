name: Build and Release cci

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: bun-linux-x64
            artifact_name: cci-linux-x64
            archive_name: cci-linux-x64.tar.gz
          - runs-on: macos-13
            target: bun-darwin-x64
            artifact_name: cci-darwin-x64
            archive_name: cci-darwin-x64.tar.gz

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the binary
        run: bun build --compile ./src/index.ts --outfile ./dist/cci --target=${{ matrix.target }}

      - name: Package the binary
        run: |
          chmod +x dist/cci
          tar -czf dist/${{ matrix.archive_name }} -C dist cci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cci-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
